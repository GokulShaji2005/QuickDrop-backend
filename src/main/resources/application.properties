spring.application.name=quickdrop
spring.datasource.url=jdbc:postgresql://localhost:5432/quickdrop?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
server.port=9090
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

# Fix: Disable multi-tenancy (not needed for single-tenant app)
spring.jpa.properties.hibernate.multiTenancy=NONE
jwt.secret=${JWT_SECRET}
# Debug logging
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG